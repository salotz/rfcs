# Tooling for CUE modules in this folder. Each module has its own
# vet/fmt tasks so it can be lifted into a standalone repository.

[tools]
cue = "0.17.1"

[tasks.vet]
description = "Vet every CUE module"
depends = [
	"std:vet",
	"mime:vet",
	"semver:vet",
	"http:vet",
	"unix:vet",
	"url:vet",
	"git:vet",
	"keep-a-changelog:vet",
	"prj-spec:vet",
	"xdg-base-directory:vet",
]

[tasks.fmt]
description = "Format every CUE module"
depends = [
	"std:fmt",
	"mime:fmt",
	"semver:fmt",
	"http:fmt",
	"unix:fmt",
	"url:fmt",
	"git:fmt",
	"keep-a-changelog:fmt",
	"prj-spec:fmt",
	"xdg-base-directory:fmt",
]

[tasks."std:vet"]
description = "Vet salotz.info/std"
dir = "std"
run = "cue vet ./..."

[tasks."std:fmt"]
description = "Format salotz.info/std"
dir = "std"
run = "cue fmt ./..."

